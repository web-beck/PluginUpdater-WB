name: PluginUpdater-WB
version: ${project.version}
main: me.webbeck.pluginUpdater.PluginUpdater
api-version: "26.3"
author: WebBeck
description: Highly advanced, fully asynchronous plugin manager and updater for Paper.

commands:
  updater:
    description: Main command for PluginUpdater-WB
    usage: /<command> help
    aliases: [upd]

permissions:
  pluginupdater.admin:
    description: Allows full access to the updater commands.
    default: op